name: notes_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  provider: ^6.1.5
  nested: ^1.0.0

  # Routing
  auto_route: ^10.1.0

  # Networking
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # retrofit is a type conversion dio client generator using source_gen and
  # inspired by Chopper and Retrofit.
  # Pinned: retrofit >4.9.0 adds Parser.DartMappable, which retrofit_generator
  # 9.x cannot compile against.
  retrofit: 4.9.0

  # Localization
  easy_localization: ^3.0.7

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # A Flutter implementation of React hooks:
  flutter_hooks: ^0.20.5

  # Code generation / serialization (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI & design
  flutter_svg: ^2.0.10+1
  # Pinned: flutter_gen 5.13+ ships a build.yaml that build_runner 2.5 rejects.
  flutter_gen: 5.12.0
  gap: ^3.0.1
  overlay_support: ^2.1.0
  theme_tailor_annotation: ^3.0.1

  # Utilities
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  open_settings_plus: ^0.4.0

  #  Implementations of SHA, MD5, and HMAC cryptographic functions.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation tools
  build_runner: ^2.5.4
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  auto_route_generator: ^10.2.3
  injectable_generator: ^2.7.0
  mobx_codegen: ^2.7.1
  retrofit_generator: ^9.1.9
  theme_tailor: ^3.0.1
  flutter_gen_runner: 5.12.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    # only these keys are valid for v5.x
    image: true
    flutter_svg: true
    rive: false
    lottie: false

  assets:
    exclude:
      - assets/translations/*.json
      - assets/**/.gitkeep
    outputs:
      class_name: Assets

  fonts:
    enabled: true
    outputs:
      class_name: FontFamily

  colors:
    enabled: true
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors
